!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vuelve | Fidelización para pequeños negocios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F6;--surface:#FFFFFF;--ink:#14161B;--ink2:#464C58;--muted:#737985;
  --line:#E3E6EB;--soft:#EDEFF2;--warn:#B45309;--warn-soft:#FDF2E3;--warn-line:#F3D9B1;
  --ok:#157F3D;--ok-soft:#E6F5EB;--danger:#B42318;
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --demo-h:56px;
}
.bs{--brand-soft:color-mix(in srgb,var(--brand) 9%,#fff);--brand-tint:color-mix(in srgb,var(--brand) 24%,#fff);--brand-deep:color-mix(in srgb,var(--brand) 78%,#000)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--brand-tint,#BFD4FF);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em;line-height:1.15;font-weight:700}
h1{font-size:28px}
h2{font-size:19px}
h3{font-size:16.5px}
p{margin:0}
.muted{color:var(--muted)}.ink2{color:var(--ink2)}.small{font-size:13.5px}
.ic{flex:none;display:block}
.stack-y{display:flex;flex-direction:column}
.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.gap20{gap:20px}.gap24{gap:24px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* demo bar */
.demo{position:sticky;top:0;z-index:40;height:var(--demo-h);background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.demo::-webkit-scrollbar{display:none}
.demo .tag{font-size:13px;color:#9EA4AF;white-space:nowrap;flex:none}
.demo .seg{display:flex;background:#272A32;border-radius:999px;padding:3px;flex:none}
.demo .seg button{padding:0 14px;min-height:36px;border-radius:999px;font-size:14px;font-weight:600;color:#C5C9D1;white-space:nowrap}
.demo .seg button.on{background:#fff;color:var(--ink)}
.demo .tog{display:flex;align-items:center;gap:8px;font-size:14px;color:#C5C9D1;white-space:nowrap;flex:none;margin-left:auto;min-height:40px;padding:0 4px}
.sw{width:40px;height:24px;border-radius:999px;background:#3A3E48;position:relative;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on .sw{background:#6E9BFF}.tog.on .sw::after{left:19px}

/* buttons */
.btn{min-height:52px;padding:0 20px;border-radius:14px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:var(--soft);color:var(--ink)}
.btn-outline{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-dark{background:var(--ink);color:#fff}
.btn-on{background:var(--on-brand);color:var(--brand)}
.btn-onghost{background:color-mix(in srgb,var(--on-brand) 16%,transparent);color:var(--on-brand)}
.btn-block{width:100%}
.btn-lg{min-height:60px;font-size:17px;border-radius:16px}
.btn-sm{min-height:44px;padding:0 16px;font-size:15px;border-radius:12px}
.btn-wa{background:#E8F7EE;color:#0F6B3A}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);flex:none}
.iconbtn:hover{background:var(--soft)}
.link{color:var(--brand-deep);font-weight:600;font-size:15px;min-height:44px;display:inline-flex;align-items:center;gap:4px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.av{width:44px;height:44px;border-radius:50%;background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.av.sm{width:36px;height:36px;font-size:13px}
.av.lg{width:60px;height:60px;font-size:20px}
.avstack{display:flex;padding-left:10px}
.avstack .av{margin-left:-10px;border:3px solid var(--surface);width:40px;height:40px;font-size:13px}
.logo{border-radius:30%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--ink2)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.brand{background:var(--brand-soft);color:var(--brand-deep)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{opacity:.6;font-weight:500}

/* fields */
.field{display:flex;flex-direction:column;gap:8px}
.field label,.flabel{font-size:14.5px;font-weight:600;color:var(--ink2)}
.input{min-height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px;font-size:17px;width:100%;outline:none;transition:border-color .15s}
textarea.input{padding:14px 16px;min-height:96px;resize:vertical}
.input:focus{border-color:var(--brand)}
.input.big{min-height:64px;font-size:22px;font-weight:600;letter-spacing:.02em}
.err{color:var(--danger);font-size:14px;font-weight:500;display:flex;gap:6px;align-items:flex-start}
.searchbox{position:relative}
.searchbox .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox .input{padding-left:48px}

/* owner layout */
.owner{min-height:calc(100dvh - var(--demo-h))}
.side{display:none}
.main{padding:16px 16px 120px;max-width:1180px;margin:0 auto;width:100%}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-height:56px;justify-content:center;border-radius:12px}
.bnav button.on{color:var(--ink)}
.bnav button.on .ic{color:var(--brand)}
.bnav .fab .fabc{width:58px;height:58px;border-radius:20px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;margin-top:-28px;box-shadow:0 6px 18px color-mix(in srgb,var(--brand) 35%,transparent)}
.bnav .fab{color:var(--ink)}
.mtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.bizline{display:flex;align-items:center;gap:10px;font-weight:700}
@media(min-width:960px){
  .owner{display:grid;grid-template-columns:260px 1fr}
  .side{display:flex;flex-direction:column;gap:20px;position:sticky;top:var(--demo-h);height:calc(100dvh - var(--demo-h));padding:22px 16px;background:var(--surface);border-right:1px solid var(--line)}
  .side-biz{display:flex;align-items:center;gap:12px;padding:4px 6px}
  .side-biz b,.side-foot b{display:block;font-size:15px;line-height:1.2}
  .side-nav{display:flex;flex-direction:column;gap:2px}
  .side-nav button{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:12px;font-weight:600;color:var(--ink2);font-size:15px}
  .side-nav button:hover{background:var(--soft)}
  .side-nav button.on{background:var(--brand-soft);color:var(--brand-deep)}
  .side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px;border-top:1px solid var(--line)}
  .side-foot>div:nth-child(2){flex:1;min-width:0}
  .bnav{display:none}
  .main{padding:36px 44px 56px}
  .mtop{display:none}
  h1{font-size:32px}
}

/* page header */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.phead p{color:var(--ink2);margin-top:6px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--ink2);font-weight:600;min-height:44px;margin:-6px 0 4px -6px;padding:0 6px;border-radius:10px}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:112px;transition:border-color .15s}
.tile:hover{border-color:var(--brand-tint)}
.tile .num{font-family:var(--display);font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1}
.tile .lbl{font-size:15px;color:var(--ink2);line-height:1.3;margin-top:auto}
.tile.warn{background:var(--warn-soft);border-color:var(--warn-line)}
.tile.warn .num{color:var(--warn)}
@media(min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}}

.home-grid{display:grid;gap:16px;margin-top:16px}
@media(min-width:960px){.home-grid{grid-template-columns:1.25fr 1fr;align-items:start}}

/* recover */
.recover{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px}
.recover .big{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.25;letter-spacing:-.02em}

/* progress card: the signature element */
.pcard{background:var(--brand);color:var(--on-brand);border-radius:24px;padding:20px 20px 18px;position:relative;overflow:hidden}
.pcard .cap{font-size:14px;opacity:.8;font-weight:500}
.pcard .ttl{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.perf{border-top:2px dashed color-mix(in srgb,var(--on-brand) 30%,transparent);margin:16px -20px 14px;position:relative}
.perf::before,.perf::after{content:'';position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--hole,var(--bg))}
.perf::before{left:-10px}.perf::after{right:-10px}
.stamps{display:grid;gap:10px;margin:18px 0 6px}
.st{aspect-ratio:1;width:100%;max-width:60px;justify-self:center;border-radius:50%;border:2px dashed color-mix(in srgb,var(--on-brand) 45%,transparent);display:grid;place-items:center}
.st.on{border:0;background:var(--on-brand);color:var(--brand);transform:rotate(var(--rot))}
.st svg{width:54%;height:54%}
.st.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1.7) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(var(--rot));opacity:1}}
.pcard .count{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.02em}
.pcard .hint{font-size:15.5px;opacity:.9}
.pcard.compact{padding:16px;border-radius:20px}
.pcard.compact .stamps{gap:6px;margin:12px 0 4px}
.pcard.compact .ttl{font-size:18px}

/* list rows */
.list{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 2px;min-height:68px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.lrow:last-child{border-bottom:0}
.lrow .grow{flex:1;min-width:0}
.lrow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .sub{font-size:14px;color:var(--muted)}
.lrow .chev{color:var(--muted)}
.ccards{display:grid;gap:10px}
@media(min-width:720px){.ccards{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:76px}
.ccard .grow{flex:1;min-width:0}
.ccard b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);margin-top:4px}
.bar{height:6px;border-radius:999px;background:var(--soft);overflow:hidden;flex:1;max-width:120px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:999px}

/* campaign cards */
.camps{display:grid;gap:12px}
@media(min-width:720px){.camps{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}}
.camp{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-align:left;width:100%;display:flex;flex-direction:column}
.camp .band{background:var(--brand);color:var(--on-brand);padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.camp .band .ttl{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.2}
.camp.off .band{background:var(--soft);color:var(--ink2)}
.camp .body{padding:14px 18px 16px;display:flex;flex-direction:column;gap:10px}
.camp .facts{display:flex;gap:18px;font-size:14px;color:var(--ink2)}
.camp .facts b{display:block;font-family:var(--display);font-size:20px;color:var(--ink)}

/* option cards (wizard) */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);min-height:72px;width:100%}
.opt .grow{flex:1}
.opt b{display:block;font-weight:600}
.opt .sub{font-size:14px;color:var(--muted)}
.opt .radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.on .radio{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}
.stepper{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 0}
.stepper .val{font-family:var(--display);font-size:64px;font-weight:800;min-width:96px;text-align:center;letter-spacing:-.04em;line-height:1}
.stepper button{width:60px;height:60px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.wz{display:grid;gap:24px}
.wz-top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.prog{flex:1;height:6px;background:var(--soft);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .3s}
.wz-foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}
.wz-foot .btn{flex:1}
.wz-foot .btn.back{flex:0 0 auto}
.prevlabel{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:10px}
.upload{display:flex;align-items:center;gap:14px;padding:14px;border:1.5px dashed var(--line);border-radius:16px;background:var(--surface);cursor:pointer;min-height:72px}
.upload input{display:none}
.upload .thumb{width:48px;height:48px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--muted);overflow:hidden;flex:none}
.upload .thumb img{width:100%;height:100%;object-fit:cover}
@media(min-width:960px){
  .wz{grid-template-columns:minmax(0,1fr) 360px;align-items:start;gap:48px}
  .wz-side{position:sticky;top:calc(var(--demo-h) + 36px)}
  .wz-foot{position:static;border:0;padding:0;background:none;margin-top:28px}
  .wz-foot .btn{flex:0 0 auto;min-width:160px}
  .wz-foot .btn.back{min-width:0;width:60px}
}

/* metrics */
.bars{display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b i{width:100%;max-width:38px;border-radius:8px 8px 4px 4px;background:var(--brand-tint)}
.bars .b.last i{background:var(--brand)}
.bars .b span{font-size:12px;color:var(--muted)}
.bars .b em{font-style:normal;font-size:12.5px;font-weight:600;color:var(--ink2)}
.mgrid{display:grid;gap:16px}
@media(min-width:960px){.mgrid{grid-template-columns:1.4fr 1fr}}
.say{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.25;letter-spacing:-.02em}

/* personalization */
.pgrid{display:grid;gap:20px}
@media(min-width:960px){.pgrid{grid-template-columns:minmax(0,1fr) 380px;align-items:start}.pgrid .sticky{position:sticky;top:calc(var(--demo-h) + 36px)}}
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.swatch{width:52px;height:52px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.swatch.on{box-shadow:0 0 0 3px var(--ink)}
.swatch.custom{background:conic-gradient(#E4572E,#D99A00,#2E9E5B,#2F6FED,#8E44AD,#E4572E);position:relative;overflow:hidden}
.swatch.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-size:14.5px}
.minip{background:var(--bg);border:1px solid var(--line);border-radius:28px;padding:16px;--hole:var(--bg)}

/* phone column (client, employee) */
.phone{max-width:460px;margin:0 auto;min-height:calc(100dvh - var(--demo-h));background:var(--bg);--hole:var(--bg)}
@media(min-width:600px){.phone{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.pad{padding:16px 18px 40px}
.chead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:var(--demo-h);z-index:5}
.chead .grow{flex:1;min-width:0}
.chead b{display:block;line-height:1.2}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-height:44px;padding:0 12px;border-radius:11px;font-weight:600;font-size:14.5px;color:var(--ink2);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,22,27,.08)}
.others{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.others::-webkit-scrollbar{display:none}
.oc{flex:0 0 172px;border-radius:18px;padding:14px;background:var(--brand);color:var(--on-brand);text-align:left;min-height:112px;display:flex;flex-direction:column;gap:6px}
.oc b{font-family:var(--display);font-size:16px;line-height:1.2}
.oc .bar{background:color-mix(in srgb,var(--on-brand) 22%,transparent);max-width:none;margin-top:auto}
.oc .bar i{background:var(--on-brand)}
.ticket{border:2px dashed var(--brand-tint);background:var(--brand-soft);border-radius:20px;padding:18px}
.ticket .code{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.06em;color:var(--brand-deep)}
.used{opacity:.6}

/* employee */
.ehead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.ehead .grow{flex:1;min-width:0}
.ehead b{display:block;line-height:1.2}
.bigtile{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:22px 20px;border-radius:22px;min-height:104px;background:var(--surface);border:1.5px solid var(--line)}
.bigtile.primary{background:var(--brand);color:var(--on-brand);border-color:transparent}
.bigtile b{display:block;font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.01em}
.bigtile span span{font-size:15px;opacity:.8}
.bigtile .ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--soft);flex:none}
.bigtile.primary .ico{background:color-mix(in srgb,var(--on-brand) 18%,transparent)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:600;margin:14px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.viewfinder{aspect-ratio:1;border-radius:28px;background:#16181D;position:relative;overflow:hidden;display:grid;place-items:center}
.viewfinder .frame{width:62%;aspect-ratio:1;position:relative}
.viewfinder .frame i{position:absolute;width:34px;height:34px;border:4px solid #fff}
.viewfinder .frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.viewfinder .frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.viewfinder .frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 12px}
.viewfinder .frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 12px 0}
.viewfinder .line{position:absolute;left:8%;right:8%;height:3px;background:var(--brand-tint);border-radius:3px;animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{from{top:10%}to{top:88%}}
.sticky-bottom{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--soft);border-radius:14px;padding:12px}
.kv b{display:block;font-family:var(--display);font-size:18px;line-height:1.2}
.kv span{font-size:13px;color:var(--muted)}

/* empty states */
.empty{text-align:center;padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .eic{width:72px;height:72px;border-radius:24px;background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;margin-bottom:4px}
.empty p{color:var(--ink2);max-width:340px}
.steps{display:flex;flex-direction:column;gap:12px;counter-reset:s}
.stp{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;width:100%}
.stp .n{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;font-weight:700;flex:none}
.stp.done .n{background:var(--brand);color:var(--on-brand)}

/* layers */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(20,22,27,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:90dvh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1);--hole:var(--surface)}
.sheet .handle{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.sheet-x{display:flex;justify-content:flex-end;margin:-4px -8px 0 0}
@media(min-width:720px){.scrim{align-items:center}.sheet{border-radius:26px;padding-bottom:24px}.sheet .handle{display:none}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.succ{position:fixed;inset:0;z-index:70;background:var(--surface);display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .2s;overflow:auto}
.succ-in{max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.succ-in p{color:var(--ink2);font-size:17px}
.checkc{width:104px;height:104px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;margin-bottom:8px;animation:pop2 .45s cubic-bezier(.2,1.5,.4,1)}
.checkc path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .4s .25s forwards}
@keyframes pop2{from{transform:scale(.4)}to{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.succ-in .pcard{text-align:left;width:100%}.succ-in .pcard p{color:inherit;font-size:15.5px}
.succ-actions{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:16px}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;padding:14px 18px;border-radius:14px;display:flex;gap:10px;align-items:center;font-weight:600;box-shadow:0 10px 30px rgba(20,22,27,.25);animation:up .25s;max-width:calc(100% - 32px)}
@media(min-width:960px){.toast{bottom:32px}}

/* login */
.login{min-height:calc(100dvh - var(--demo-h));display:grid;place-items:center;padding:24px 16px;background:var(--bg)}
.login-box{width:100%;max-width:420px}
.wordmark{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.04em;display:flex;align-items:center;gap:10px}
.wordmark i{width:34px;height:34px;border-radius:11px;background:var(--ink);display:grid;place-items:center;color:#fff;font-style:normal}


/* ---- tarjetas con degradado ---- */
.pcard.grad{background:var(--mesh);background-size:160% 160%;color:var(--ink);isolation:isolate;animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{from{background-position:0% 0%}to{background-position:100% 100%}}
.pcard.grad::after,.coupon::after,.backcard::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--mx,25%) var(--my,0%),rgba(255,255,255,.6),transparent 42%);pointer-events:none;z-index:-1}
.pcard.grad .cap{opacity:.62}
.pcard.grad .perf,.coupon .perf{border-top-color:rgba(20,22,27,.16)}
.pcard.grad .st{border-color:rgba(20,22,27,.2);background:rgba(255,255,255,.5)}
.pcard.grad .st.on{background:var(--brand);color:var(--on-brand);box-shadow:0 5px 12px color-mix(in srgb,var(--brand) 32%,transparent)}
.pcard.grad .hint{opacity:.75}
.pcard.grad .btn-on{background:var(--ink);color:#fff}
.pcard.grad .btn-onghost{background:rgba(255,255,255,.65);color:var(--ink)}
.pcard.full::before{content:'';position:absolute;top:0;bottom:0;width:45%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);animation:sweep 2.2s .4s ease-out 2;pointer-events:none;z-index:2}
@keyframes sweep{to{left:130%}}
.flip{perspective:1400px;cursor:pointer;-webkit-user-select:none;user-select:none;border-radius:24px}
.flip-in{position:relative;transition:transform .7s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face-back{position:absolute;inset:0;transform:rotateY(180deg);display:flex}
.backcard{position:relative;isolation:isolate;flex:1;border-radius:24px;background:var(--mesh);background-size:160% 160%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;color:var(--ink);text-align:center;overflow:hidden}
.backcard.solid{background:var(--brand);color:var(--on-brand)}
.backcard .qrwrap{background:#fff;padding:10px;border-radius:18px;box-shadow:0 10px 26px rgba(20,22,27,.14);line-height:0}
.fliphint{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px;color:var(--muted);margin-top:10px}
.coupon{position:relative;isolation:isolate;border-radius:22px;padding:20px;background:var(--mesh);background-size:160% 160%;color:var(--ink);overflow:hidden;--hole:var(--bg)}
.coupon.solid{background:var(--brand);color:var(--on-brand)}
.coupon h2{font-size:22px}
.coupon .code{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.06em}
.slide{position:relative;height:60px;border-radius:999px;background:rgba(255,255,255,.72);overflow:hidden;touch-action:none}
.slide .lbl{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:15px;color:var(--ink2);padding-left:44px;pointer-events:none}
.slide .fill{position:absolute;left:0;top:0;bottom:0;width:60px;background:color-mix(in srgb,var(--brand) 20%,transparent);border-radius:999px;pointer-events:none}
.slide .thumb{position:absolute;top:4px;left:4px;width:52px;height:52px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;box-shadow:0 4px 12px color-mix(in srgb,var(--brand) 35%,transparent);touch-action:none;cursor:grab}
.slide.back .thumb,.slide.back .fill{transition:transform .25s, width .25s}
.slide.nudge .thumb{animation:nudge .7s}
@keyframes nudge{30%{transform:translateX(30px)}60%{transform:translateX(-4px)}}
.revealed{display:flex;align-items:center;gap:14px;background:#fff;color:var(--ink);border-radius:18px;padding:12px;animation:up .35s}
.revealed .qr{line-height:0}
.oc.grad{background:var(--mesh);color:var(--ink)}
.oc.grad .bar{background:rgba(20,22,27,.12)}.oc.grad .bar i{background:var(--brand)}
.styles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stylebtn{border:1.5px solid var(--line);border-radius:16px;padding:8px 8px 10px;text-align:left;background:var(--surface);font-weight:600;font-size:14.5px}
.stylebtn .sw2{height:56px;border-radius:11px;margin-bottom:8px;background-size:160% 160%}
.stylebtn.on{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.checkc path{stroke-dashoffset:0}}

function lum(hex){
  const n = hex.replace('#','');

  return .2126*r + .7152*g + .0722*b;
}

function icon(n, s=22, sw=1.9){

}

function qrSvg(seed='x', size=200){
  let h = 0; for (const ch of String(seed)) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => (h = (h*1664525 + 1013904223) >>> 0) / 4294967296;
  const N = 29; let r = '';
  const inFinder = (x,y) => (x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
  for (let y=0;y<N;y++) for (let x=0;x<N;x++) if (!inFinder(x,y) && rnd() > .52) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  const f = (x,y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  return `<svg width="${size}" height="${size}" viewBox="-2 -2 33 33" role="img" aria-label="Código QR" xmlns="http://www.w3.org/2000/svg"><rect x="-2" y="-2" width="33" height="33" fill="#fff" rx="2"/><g fill="#14161B">${r}${f(0,0)}${f(N-7,0)}${f(0,N-7)}</g></svg>`;
}


function hexToHsl(hex){
  const r = parseInt(hex.substr(1,2),16)/255, g = parseInt(hex.substr(3,2),16)/255, b = parseInt(hex.substr(5,2),16)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b); let h = 0, s = 0; const l = (mx+mn)/2;
  if (mx !== mn) { const d = mx-mn; s = l > .5 ? d/(2-mx-mn) : d/(mx+mn); h = (mx===r ? (g-b)/d + (g<b?6:0) : mx===g ? (b-r)/d + 2 : (r-g)/d + 4) * 60; }
  return [Math.round(h), Math.round(s*100), Math.round(l*100)];
}
const PRESETS = {amanecer:['#FF9A8B','#FFC3A0','#FECF6A','#A1E3FF'], aurora:['#7DF2C9','#A99CFF','#7FCBFF','#DCCBFF']};
const STYLE_NAMES = {marca:'Degradado de tu marca', amanecer:'Amanecer', aurora:'Aurora', solido:'Color sólido'};
function meshColors(style, brand){
  if (PRESETS[style]) return PRESETS[style];
  const [h,s] = hexToHsl(brand), sat = Math.max(55, Math.min(s, 88));
  return [`hsl(${h} ${sat}% 80%)`, `hsl(${(h+40)%360} ${sat}% 84%)`, `hsl(${(h+320)%360} ${sat}% 86%)`, `hsl(${(h+190)%360} 70% 88%)`];
}
function meshBg(style, brand){
  const [a,b,c,d] = meshColors(style, brand);
  return `radial-gradient(at 8% 6%, ${a} 0, transparent 58%),radial-gradient(at 92% 16%, ${b} 0, transparent 55%),radial-gradient(at 12% 96%, ${c} 0, transparent 60%),radial-gradient(at 94% 92%, ${d} 0, transparent 58%),#FFFFFF`;
}
const gradAttr = (style, brand) => style === 'solido' ? '' : `--mesh:${meshBg(style, brand)};`;

function stamps(n, total, popIndex=-1){
  const cols = total <= 5 ? total : Math.ceil(total/2);
  let o = `<div class="stamps" style="grid-template-columns:repeat(${cols},1fr)" role="img" aria-label="${n} de ${total} visitas">`;
  for (let i=0;i<total;i++){
    const rot = ((i*37) % 13) - 6;
    o += i < n ? `<span class="st on${i===popIndex?' pop':''}" style="--rot:${rot}deg">${icon('check',24,3)}</span>` : `<span class="st"></span>`;
  }
  return o + '</div>';
}

function remainingText(n, meta, premio){
  const left = Math.max(meta - n, 0);
  if (left === 0) return `¡Completaste tu tarjeta! Ya puedes reclamar ${premio}.`;
  return `Te ${left === 1 ? 'falta 1 visita' : `faltan ${left} visitas`} para obtener ${premio}.`;
}

function pcard({cap:c='', titulo, n, meta, premio, foot='', compact=false, pop=-1, style=S.cardStyle, brand=S.brand}){
  const g = style !== 'solido';
  return `<div class="pcard${compact?' compact':''}${g?' grad':''}${n>=meta?' full':''}" style="${gradAttr(style, brand)}">

}

function pendingRewards(){
  const out = [];
  D().clients.forEach(c => Object.entries(c.cards).forEach(([cid, n]) => {

}

function readImage(file, cb, errCb){
  if (!file) return;
  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return errCb('Ese formato no sirve. Usa una imagen PNG, JPG o WebP.');
  if (file.size > 1024*1024) return errCb(`Tu imagen pesa ${(file.size/1024/1024).toFixed(1).replace('.',',')} MB y el máximo es 1 MB. Prueba con una versión más liviana.`);
  const r = new FileReader(); r.onload = () => cb(r.result); r.readAsDataURL(file);
}

function plusOne(){
  const e = S.emp, d = D(), c = d.clients.find(x => x.id == e.clientId), k = camp(e.campId);
  const n = (c.cards[k.id] || 0) + 1; c.cards[k.id] = n; c.visitas++; c.ultima = 0; c.nuevo = c.nuevo && c.visitas <= 2;
  d.todayVisits++; d.activity.unshift({t:`${c.nombre} sumó una visita`, w:'Ahora'});
  if (c.id === 1) CAMILA_HIST.unshift({t:'Sumaste una visita', c:k.titulo, w:'Ahora'});
  e.pop = n - 1;
  const done = n >= k.meta, left = k.meta - n;
  success({title: done ? `¡${esc(first(c.nombre))} completó su tarjeta!` : '¡Visita registrada!',
    text: done ? `Entrégale ${esc(k.premio)}.` : `${esc(first(c.nombre))} lleva ${n} de ${k.meta}. ${left === 1 ? 'Le falta 1 visita' : `Le faltan ${left} visitas`} para ${esc(k.premio)}.`,
    extra: `<div style="width:100%;max-width:340px;--hole:var(--surface)" class="mt8">${pcard({titulo:k.titulo, n, meta:k.meta, premio:k.premio, compact:true, pop:n-1})}</div>`,

  role:v => { S.role = v; S.loginErr = {}; if (v === 'employee') S.emp = {step:'home', q:'', clientId:null, campId:null, newName:'', err:''}; if (v === 'owner' && S.view === 'registrar') S.view = 'home'; closeLayer(); render(); window.scrollTo(0,0); },
  empty:() => { S.empty = !S.empty; S.search = ''; S.filter = 'todos'; S.cbiz = 0; if (['campana','crear'].includes(S.view)) S.view = 'home'; S.wz = null; S.emp.step = 'home'; closeLayer(); render(); },
  go:v => go(v),
  more:() => sheet(`<h2>Más opciones</h2><div class="list mt12">${NAV.slice(3).map(n => `<button class="lrow" data-act="go" data-v="${n[0]}"><span class="iconbtn" style="background:var(--brand-soft);color:var(--brand-deep)">${icon(n[2])}</span><div class="grow"><b>${n[1]}</b></div>${icon('chev',20)}</button>`).join('')}<button class="lrow" data-act="role" data-v="login"><span class="iconbtn">${icon('logout')}</span><div class="grow"><b>Cerrar sesión</b></div></button></div>`),
  close:() => closeLayer(),
  scrim:(v,t,e) => { if (e.target === t) closeLayer(); },
  tile:v => { if (v === 'recompensas') { S.rewardTab = 'done'; go('recompensas'); } else { S.filter = v === 'riesgo' ? 'riesgo' : v === 'nuevos' ? 'nuevos' : 'todos'; S.search = ''; go('clientes'); } },
  filter:v => { S.filter = v; render(); },
  openClient:v => openClient(v),
  recover:() => openRecover(),
  registerFor:v => { closeLayer(); if (S.role === 'owner') { S.view = 'registrar'; } S.emp = {step:'client', q:'', clientId:+v, campId:null, newName:'', err:''}; render(); window.scrollTo(0,0); },
  newCamp:v => { S.wz = newWz(v); S.view = 'crear'; closeLayer(); render(); window.scrollTo(0,0); },
  editCamp:v => { S.wz = newWz(null, camp(v)); S.view = 'crear'; render(); window.scrollTo(0,0); },
  openCamp:v => { S.campId = +v; go('campana'); },
  toggleCamp:v => { const k = camp(v); k.activa = !k.activa; if (!k.activa && !k.fin) k.fin = iso(new Date()); if (k.activa) k.fin = ''; render(); toast(k.activa ? 'Campaña activada' : 'Campaña terminada'); },
  dlqr:v => downloadQR(v),
  notify:() => openNotify(),
  wzObj:v => { const w = S.wz; w.obj = v; const keep = {titulo:w.titulo, premio:w.premio}; Object.assign(w, OBJ[v].set); if (v !== 'recuperar') { w.titulo = keep.titulo; w.premio = keep.premio; } if (w.cuando === 'dias' && !w.fin) { const e = new Date(); e.setDate(e.getDate() + (v === 'recuperar' ? 14 : 30)); w.fin = iso(e); } w.err = ''; render(); },
  wzSet:(v,t) => { const k = t.dataset.k; S.wz[k] = k === 'meta' ? +v : v; if (k === 'cuando' && v === 'dias' && !S.wz.fin) { const e = new Date(); e.setDate(e.getDate()+30); S.wz.fin = iso(e); } S.wz.err = ''; render(); },
  wzMeta:v => { S.wz.meta = Math.min(20, Math.max(1, S.wz.meta + +v)); render(); },
  wzNext:() => wzNext(),
  wzBack:() => { const steps = wzSteps(), cur = steps.indexOf(WZ_STEPS[S.wz.step]); if (cur > 0) S.wz.step = WZ_STEPS.indexOf(steps[cur-1]); S.wz.err = ''; render(); },
  wzExit:() => { const back = S.wz && S.wz.editId ? 'campana' : 'campanas'; S.wz = null; go(back); },
  rtab:v => { S.rewardTab = v; render(); },
  deliver:v => askDeliver(v),
  doDeliver:v => doDeliver(v),
  period:v => { S.period = v; render(); },
  swatch:v => { S.brand = v; render(); },
  rmLogo:() => { S.logo = null; S.logoErr = ''; render(); },
  saveBrand:() => { S.bizName = S.bizName.trim() || 'Mi negocio'; render(); toast('Cambios guardados'); },
  empGo:v => { S.emp.step = v; S.emp.err = ''; if (v === 'home') { S.emp.q = ''; S.emp.newName = ''; } render(); },
  empPick:v => { S.emp = {...S.emp, step:'client', clientId:+v, campId:null}; render(); },
  empCamp:v => { S.emp.campId = +v; render(); },
  empCreate:() => { const e = S.emp, n = e.newName.trim(); if (n.length < 2) { e.err = 'Escribe el nombre del cliente.'; return render(); }
    const d = D(); const c = C(Date.now(), n, e.q.replace(/\D/g,'').slice(-10), 0, 0, {}, true); d.clients.push(c); d.week.nuevos++;
    d.activity.unshift({t:`${n} se unió`, w:'Ahora'}); S.emp = {...e, step:'client', clientId:c.id, campId:null, err:''}; render(); toast('Cliente inscrito'); },
  plusOne:(v,t) => { t.disabled = true; plusOne(); },
  empDeliver:() => empDeliver(),
  empReset:() => { closeLayer(); S.emp = {step:'home', q:'', clientId:null, campId:null, newName:'', err:''}; render(); },
  cTab:v => { S.ctab = v; render(); },
  cBiz:v => { S.cbiz = +v; S.ctab = 'progreso'; render(); window.scrollTo(0,0); },
  cCode:() => { const b = curClientBiz(); sheet(`<div style="text-align:center"><h2>Tu código</h2><p class="ink2 mt8">Muéstralo en caja para sumar tu visita o reclamar tu premio.</p><div class="mt20" style="display:flex;justify-content:center">${qrSvg('camila-' + b.key, 240)}</div><p class="muted mt12">Camila, ${fmtTel('3004567812')}</p></div>`, b.color); },
  cReward:() => { const b = curClientBiz(), m = b.main; sheet(`<div style="text-align:center"><div class="empty" style="padding:8px 0 0"><div class="eic">${icon('gift',32)}</div></div><h2>${esc(cap(m.premio))}</h2><p class="ink2 mt8">${esc(m.descripcion || '')} ${esc(remainingText(m.n, m.meta, m.premio))}</p></div><div class="mt20">${pcard({titulo:m.titulo, n:m.n, meta:m.meta, premio:m.premio, compact:true, style:b.style, brand:b.color})}</div><button class="btn btn-primary btn-lg btn-block mt16" data-act="close">Entendido</button>`, b.color); },
  copyWa:() => copyText(S.waMsg || '').then(ok => toast(ok ? 'Mensaje copiado' : 'No pudimos copiar. Selecciona el texto y cópialo.')),
  flipCard:(v,t,e) => { const f = $('.flip'); if (f) { f.classList.toggle('on'); if (t !== f) f.scrollIntoView({behavior:'smooth', block:'center'}); } },
  cardStyle:v => { S.cardStyle = v; render(); },
  slideTap:(v,t,e) => { if (dragMoved) return; const sl = t.closest('.slide'); if (e.detail === 0) return revealCoupon(sl); sl.classList.remove('nudge'); void sl.offsetWidth; sl.classList.add('nudge'); },
  wallet:() => toast('Tarjeta guardada en tu Wallet'),
  loginTab:v => { S.loginTab = v; S.loginErr = {}; render(); },
  doLogin:() => { const er = {}; if (!/^\S+@\S+\.\S+$/.test(LOGIN.mail)) er.mail = 'Escribe un correo válido, por ejemplo laura@cafelaurel.com.'; if (LOGIN.pass.length < 6) er.pass = 'La contraseña debe tener al menos 6 caracteres.'; S.loginErr = er; if (Object.keys(er).length) return render(); S.role = 'owner'; S.view = 'home'; render(); toast('Hola de nuevo, Laura'); },
  doClient:() => { const t = LOGIN.tel.replace(/\D/g,''); if (t.length !== 10) { S.loginErr = {tel:'Escribe tu número de 10 dígitos, por ejemplo 300 123 4567.'}; return render(); } S.loginErr = {}; S.role = 'client'; S.cbiz = 0; S.ctab = 'progreso'; render(); }
};
function copyText(txt){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(txt).then(() => true).catch(() => legacyCopy(txt));
  return Promise.resolve(legacyCopy(txt));
}
function legacyCopy(txt){
  const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch(_) {} ta.remove(); return ok;
}
function openWhatsApp(href){
  const u = new URL(href);
  const phone = u.pathname.replace(/\D/g,''), msg = u.searchParams.get('text') || '';
  const api = `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(msg)}`;
  const inFrame = (() => { try { return window.self !== window.top; } catch(_) { return true; } })();
  if (!inFrame) { window.location.href = api; return; }
  S.waMsg = msg;
  sheet(`<h2>Enviar por WhatsApp</h2>
    <p class="ink2 mt8">Esta vista previa no permite abrir WhatsApp. Copia el mensaje y pégalo en el chat, o abre el archivo en tu navegador para que se abra solo.</p>
    <div class="card mt16" style="background:var(--soft);border:0"><p style="white-space:pre-wrap">${esc(msg)}</p></div>
    <p class="muted small mt8">Para: +${phone.replace(/^57/,'57 ')}</p>
    <div class="stack-y gap8 mt16"><button class="btn btn-primary btn-lg btn-block" data-act="copyWa">Copiar mensaje</button>
    <a class="btn btn-wa btn-block" href="${api}" target="_blank" rel="noopener noreferrer" data-direct="1">Intentar abrir WhatsApp</a></div>`);
}
document.addEventListener('click', e => {
  const wa = e.target.closest('a[href^="https://wa.me"]:not([data-direct])');
  if (wa) { e.preventDefault(); openWhatsApp(wa.href); return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const f = ACT[t.dataset.act]; if (f) { if (t.tagName === 'BUTTON') e.preventDefault(); f(t.dataset.v, t, e); }
});
let drag = null, dragMoved = false;
function revealCoupon(sl){ const code = sl.dataset.code; S.revealed[code] = true; sl.outerHTML = revealedHtml(code); toast('Cupón listo para mostrar'); }
document.addEventListener('pointerdown', e => {
  const th = e.target.closest('.slide .thumb'); if (!th) return;
  const sl = th.closest('.slide'); sl.classList.remove('back','nudge');
  drag = {sl, th, fill:sl.querySelector('.fill'), x0:e.clientX, max:sl.clientWidth - th.offsetWidth - 8}; dragMoved = false;
  th.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove', e => {
  if (drag) {
    const dx = Math.max(0, Math.min(e.clientX - drag.x0, drag.max)); if (dx > 4) dragMoved = true;
    drag.th.style.transform = `translateX(${dx}px)`; drag.fill.style.width = `${dx + 60}px`; return;
  }
  const c = e.target.closest('.pcard.grad, .coupon, .backcard'); if (!c) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
  c.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
});
document.addEventListener('pointerup', e => {
  if (!drag) return; const d = drag; drag = null;
  const dx = parseFloat((d.th.style.transform.match(/[\d.]+/) || [0])[0]);
  if (dx >= d.max * .85) { revealCoupon(d.sl); }
  else { d.sl.classList.add('back'); d.th.style.transform = ''; d.fill.style.width = ''; }
  setTimeout(() => dragMoved = false, 0);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('flip')) { e.preventDefault(); e.target.classList.toggle('on'); return; } if (e.key === 'Escape' && $('#layer').innerHTML) closeLayer(); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.color) { S.brand = t.value; $('#app').style.setProperty('--brand', t.value); $('#app').style.setProperty('--on-brand', onBrand(t.value)); const n = $('#cnote'); if (n) n.outerHTML = contrastNote(t.value); return; }
  switch (t.dataset.in){
    case 'search': S.search = t.value; $('#cl-list').innerHTML = clientList(); break;
    case 'wz': S.wz[t.dataset.k] = t.value; const p = $('#wz-prev'); if (p) p.innerHTML = wzPreview(); break;
    case 'bizName': S.bizName = t.value; const pp = $('#pprev .bizline span'); if (pp) pp.textContent = t.value || 'Mi negocio'; break;
    case 'empq': S.emp.q = t.value; $('#emp-res').innerHTML = empResults(); break;
    case 'empname': S.emp.newName = t.value; break;
    case 'lmail': LOGIN.mail = t.value.trim(); break;
    case 'lpass': LOGIN.pass = t.value; break;
    case 'ltel': LOGIN.tel = t.value; break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.color) { render(); return; }
  if (t.dataset.file === 'logo') readImage(t.files[0], url => { S.logo = url; S.logoErr = ''; render(); toast('Logo actualizado'); }, err => { S.logoErr = err; render(); });
  if (t.dataset.file === 'wzimg') readImage(t.files[0], url => { S.wz.img = url; S.wz.imgErr = ''; render(); }, err => { S.wz.imgErr = err; render(); });
});
render();
</script>
